<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Créditos de e-mail · Gestão TI</title>
<link rel="stylesheet" href="/static/estilo.css">
<script src="/static/sweetalert2.all.min.js"></script>
<script src="/static/comum.js"></script>
</head>
<body>
<section id="tela-app" class="oculto">
  <header id="topo"></header>
  <main class="conteudo">
    <p class="ajuda" style="margin:0 0 14px;color:var(--suave)">Cada disparo de e-mail usa 1 crédito de quem o cria. Aqui você aprova ou recusa os pedidos e libera créditos
      para qualquer pessoa, sem precisar de pedido. Quem tem este módulo envia sem limite.</p>
    <div class="barra">
      <nav class="abas" id="abas">
        <button class="aba" data-aba="pedidos">Pedidos <span class="tag pendente oculto" id="n-pendentes"></span></button>
        <button class="aba" data-aba="usuarios">Usuários e saldos</button>
        <button class="aba" data-aba="extrato">Extrato</button>
      </nav>
    </div>

    <!-- pedidos -->
    <div id="painel-pedidos" class="oculto">
      <div class="filtros" style="margin:0 0 12px;align-items:center">
        <div class="chips-status" id="p-status">
          <button class="chip ativo" data-status="pendente">Aguardando resposta</button><button class="chip" data-status="aprovado">Aprovados</button>
          <button class="chip" data-status="recusado">Recusados</button><button class="chip" data-status="cancelado">Cancelados</button><button class="chip" data-status="todos">Todos</button>
        </div>
        <input class="entrada" id="p-busca" placeholder="Buscar por nome ou login" autocomplete="off" style="flex:1;min-width:220px">
      </div>
      <div class="lista" id="pedidos"></div>
      <div class="paginacao" id="p-paginas" style="margin-top:14px"></div>
    </div>

    <!-- usuarios -->
    <div id="painel-usuarios" class="oculto">
      <div class="filtros" style="margin:0 0 12px">
        <input class="entrada" id="u-busca" placeholder="Buscar por nome, login ou e-mail" autocomplete="off">
        <select class="entrada" id="u-filtro" style="max-width:240px">
          <option value="">Todos</option><option value="zerado">Sem créditos</option><option value="com">Com créditos</option>
          <option value="pedido">Com pedido aguardando</option><option value="ilimitado">Sem limite</option>
          <option value="entrou">Já entraram na Gestão TI</option><option value="nunca">Nunca entraram</option>
        </select>
      </div>
      <div id="u-aviso" class="aviso-caixa oculto" style="margin-bottom:10px"></div>
      <p class="ajuda" style="margin:0 0 10px;color:var(--suave);display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span id="u-info">Carregando os usuários do AD…</span>
        <button class="btn peq" id="u-atualizar" title="Busca a lista de novo no AD">Atualizar do AD</button></p>
      <div class="lista" id="usuarios"></div>
      <div class="paginacao" id="u-paginas" style="margin-top:14px"></div>
    </div>

    <!-- extrato -->
    <div id="painel-extrato" class="oculto">
      <div class="filtros" style="margin:0 0 12px;align-items:center">
        <div class="chips-status" id="e-tipo">
          <button class="chip ativo" data-tipo="">Todos</button><button class="chip" data-tipo="entrada">Entradas</button>
          <button class="chip" data-tipo="saida">Saídas</button><button class="chip" data-tipo="consumo">Usados em disparos</button>
        </div>
        <input class="entrada" id="e-busca" placeholder="Buscar por pessoa, login, quem fez ou detalhe" autocomplete="off" style="flex:1;min-width:220px">
      </div>
      <div id="e-pessoa" class="oculto" style="margin:0 0 12px"></div>
      <div class="lista" id="extrato"></div>
      <div class="paginacao" id="e-paginas" style="margin-top:14px"></div>
    </div>
  </main>
</section>

<script>
const chamar = (c, o) => api(c, o, irParaInicio);
const txtCreditos = n => `${numero(n)} crédito${Number(n) === 1 ? '' : 's'}`;
let aba = 'pedidos', USUARIOS = [], timer = null;

async function abrir() {
  if (!await exigirSessao('creditos_email')) return;
  montarTopo('Créditos de e-mail', 'moeda');
  $('#tela-app').classList.remove('oculto');
  const pedida = new URLSearchParams(location.search).get('aba');
  trocarAba(['pedidos', 'usuarios', 'extrato'].includes(pedida) ? pedida : 'pedidos');
  timer = setInterval(() => { if (!document.hidden && !Swal.isVisible()) { contarPendentes(); if (aba === 'pedidos') carregarPedidos(true); } }, 15000);
}
$('#abas').addEventListener('click', ev => { const b = ev.target.closest('.aba'); if (b) trocarAba(b.dataset.aba); });
function trocarAba(nova) {
  aba = nova;
  document.querySelectorAll('.aba').forEach(x => x.classList.toggle('ativa', x.dataset.aba === aba));
  ['pedidos', 'usuarios', 'extrato'].forEach(p => $('#painel-' + p).classList.toggle('oculto', p !== aba));
  contarPendentes();
  if (aba === 'pedidos') carregarPedidos();
  if (aba === 'usuarios') carregarUsuarios();
  if (aba === 'extrato') carregarExtrato();
}
async function contarPendentes() {
  try {
    const r = await chamar('/api/email/creditos/resumo');
    $('#n-pendentes').textContent = r.pendentes; $('#n-pendentes').classList.toggle('oculto', !r.pendentes);
  } catch { /* silencioso */ }
}

// ---------------------------------------------------------------- pedidos
let P_STATUS = 'pendente', P_PAGINA = 1, PEDIDOS = [];
const P_POR_PAGINA = 10;
$('#p-status').addEventListener('click', ev => {
  const b = ev.target.closest('[data-status]'); if (!b) return;
  P_STATUS = b.dataset.status; P_PAGINA = 1;
  document.querySelectorAll('#p-status .chip').forEach(c => c.classList.toggle('ativo', c === b));
  carregarPedidos();
});
$('#p-busca').addEventListener('input', () => { P_PAGINA = 1; mostrarPedidos(); });
$('#p-paginas').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-pag]'); if (!b || b.disabled) return;
  P_PAGINA = Number(b.dataset.pag); mostrarPedidos();
  $('#painel-pedidos').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
async function carregarPedidos(silencioso = false) {
  try { PEDIDOS = await chamar('/api/email/creditos/pedidos?status=' + P_STATUS); mostrarPedidos(); }
  catch (e) { if (!silencioso) erro(e); }
}
function mostrarPedidos() {
  {
    const q = $('#p-busca').value.trim().toLowerCase();
    const todos = PEDIDOS.filter(p => !q || `${p.nome || ''} ${p.usuario}`.toLowerCase().includes(q));
    const paginas = Math.max(1, Math.ceil(todos.length / P_POR_PAGINA));
    P_PAGINA = Math.min(Math.max(1, P_PAGINA), paginas);
    const ini = (P_PAGINA - 1) * P_POR_PAGINA, lista = todos.slice(ini, ini + P_POR_PAGINA);
    $('#p-paginas').innerHTML = todos.length ? `<span>${numero(ini + 1)}–${numero(ini + lista.length)} de ${numero(todos.length)}</span>` + botoesPaginas(P_PAGINA, paginas) : '';
    $('#pedidos').innerHTML = lista.map(p => `<article class="item">
        <div class="topo-item"><b>${esc(p.nome || p.usuario)}</b><span class="tag">${esc(p.usuario)}</span><span class="tag ${p.status}">${esc(p.status_nome)}</span><span class="tag">nº ${p.id}</span></div>
        <div class="meta"><span>Pediu <b>${txtCreditos(p.quantidade)}</b> em ${dataHora(p.criado_em)}</span><span>Saldo atual: <b>${txtCreditos(p.saldo_atual)}</b></span>
          ${p.decidido_em ? `<span>${p.status === 'aprovado' ? `Liberou ${txtCreditos(p.quantidade_aprovada)}` : p.status === 'cancelado' ? 'Cancelado' : 'Recusado'} por ${esc(p.decidido_por)} em ${dataHora(p.decidido_em)}</span>` : ''}</div>
        <div class="quebra" style="font-size:14px">Motivo: ${esc(p.motivo)}</div>
        ${p.resposta ? `<div class="quebra" style="font-size:14px;color:var(--suave)">Resposta: ${esc(p.resposta)}</div>` : ''}
        ${p.status === 'pendente' ? `<div class="acoes"><button class="btn peq primario" data-op="aprovar" data-id="${p.id}">Aprovar</button>
          <button class="btn peq contorno-perigo" data-op="recusar" data-id="${p.id}">Recusar</button></div>` : ''}</article>`).join('')
      || `<div class="vazio">${q ? 'Nenhum pedido encontrado.' : P_STATUS === 'pendente' ? 'Nenhum pedido aguardando resposta.' : 'Nenhum pedido aqui.'}</div>`;
    $('#pedidos')._lista = lista;
  }
}
$('#pedidos').addEventListener('click', async ev => {
  const b = ev.target.closest('button[data-op]'); if (!b) return;
  const p = ($('#pedidos')._lista || []).find(x => x.id === Number(b.dataset.id)); if (!p) return;
  const aprovar = b.dataset.op === 'aprovar';
  const r = await Swal.fire({ title: aprovar ? 'Aprovar o pedido' : 'Recusar o pedido', showCancelButton: true, focusConfirm: false,
    confirmButtonText: aprovar ? 'Liberar créditos' : 'Recusar', cancelButtonText: 'Voltar', customClass: aprovar ? {} : { confirmButton: 'perigo' },
    html: `<div class="pilha" style="text-align:left">
      <p style="margin:0"><b>${esc(p.nome || p.usuario)}</b> pediu <b>${txtCreditos(p.quantidade)}</b> (tem ${txtCreditos(p.saldo_atual)}).</p>
      <p class="ajuda quebra" style="margin:0">Motivo: ${esc(p.motivo)}</p>
      ${aprovar ? `<div class="campo"><label for="d-qtd">Quantos créditos liberar</label><input class="entrada" id="d-qtd" type="number" min="1" max="1000" value="${p.quantidade}"></div>` : ''}
      <div class="campo"><label for="d-resp">Resposta para a pessoa (opcional)</label><textarea class="entrada" id="d-resp" rows="2" maxlength="500"></textarea></div></div>`,
    preConfirm: () => {
      const quantidade = aprovar ? Number($('#d-qtd').value) : null;
      if (aprovar && (!quantidade || quantidade < 1 || quantidade > 1000)) return Swal.showValidationMessage('Informe uma quantidade entre 1 e 1000.');
      return { quantidade, resposta: $('#d-resp').value.trim() };
    } });
  if (!r.isConfirmed) return;
  try {
    await chamar(`/api/email/creditos/pedidos/${p.id}/${aprovar ? 'aprovar' : 'recusar'}`, { method: 'POST', body: JSON.stringify(r.value) });
    toast(aprovar ? `${txtCreditos(r.value.quantidade)} liberado(s) para ${p.nome || p.usuario}.` : 'Pedido recusado.');
    carregarPedidos(); contarPendentes();
  } catch (e) { erro(e); }
});

// ---------------------------------------------------------------- usuarios e saldos
const POR_PAGINA = 20;   // a lista do AD pode ter milhares de pessoas
let PAGINA = 1;
async function carregarUsuarios(atualizar = false) {
  try {
    const r = await chamar('/api/email/creditos/usuarios' + (atualizar ? '?atualizar=true' : ''));
    USUARIOS = r.usuarios;
    $('#u-aviso').textContent = r.aviso_ad || ''; $('#u-aviso').classList.toggle('oculto', !r.aviso_ad);
    filtrarUsuarios();
  } catch (e) { erro(e); }
}
$('#u-atualizar').onclick = async ev => { const b = ev.target; b.disabled = true; await carregarUsuarios(true); b.disabled = false; toast('Lista atualizada.'); };
$('#u-busca').addEventListener('input', () => { PAGINA = 1; filtrarUsuarios(); });
$('#u-filtro').addEventListener('change', () => { PAGINA = 1; filtrarUsuarios(); });
$('#u-paginas').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-pag]'); if (!b || b.disabled) return;
  PAGINA = Number(b.dataset.pag); filtrarUsuarios();
  $('#painel-usuarios').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
// Botoes de pagina: primeira, anteriores/proximas proximas da atual e ultima, com "…" no meio
function botoesPaginas(atual, total) {
  if (total <= 1) return '';
  const nums = new Set([1, total, atual - 1, atual, atual + 1].filter(n => n >= 1 && n <= total));
  let html = `<button class="btn peq" data-pag="${atual - 1}" ${atual <= 1 ? 'disabled' : ''}>Anterior</button>`, ant = 0;
  [...nums].sort((a, b) => a - b).forEach(n => {
    if (n - ant > 1) html += '<span>…</span>';
    html += `<button class="btn peq ${n === atual ? 'indigo' : ''}" data-pag="${n}">${n}</button>`; ant = n;
  });
  return html + `<button class="btn peq" data-pag="${atual + 1}" ${atual >= total ? 'disabled' : ''}>Próxima</button>`;
}
function filtrarUsuarios() {
  const q = $('#u-busca').value.trim().toLowerCase(), f = $('#u-filtro').value;
  const lista = USUARIOS.filter(u => (!q || `${u.nome} ${u.usuario} ${u.email || ''} ${u.unidade || ''}`.toLowerCase().includes(q))
    && (!f || (f === 'zerado' && !u.ilimitado && !u.saldo) || (f === 'com' && !u.ilimitado && u.saldo > 0) || (f === 'pedido' && u.pedido_pendente)
      || (f === 'ilimitado' && u.ilimitado) || (f === 'entrou' && !u.nunca_entrou) || (f === 'nunca' && u.nunca_entrou)));
  const paginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
  PAGINA = Math.min(Math.max(1, PAGINA), paginas);
  const ini = (PAGINA - 1) * POR_PAGINA, pagina = lista.slice(ini, ini + POR_PAGINA);
  $('#u-info').textContent = `${numero(USUARIOS.length)} pessoas (usuários ativos do AD com e-mail e quem já entrou na Gestão TI)`
    + (q || f ? ` · ${numero(lista.length)} encontrada(s)` : '');
  $('#usuarios').innerHTML = pagina.map(u => `<article class="item">
      <div class="topo-item"><b>${esc(u.nome)}</b><span class="tag">${esc(u.usuario)}</span>
        ${u.ativo ? '' : '<span class="tag negada">desativado</span>'}${u.pedido_pendente ? '<span class="tag pendente">pedido aguardando</span>' : ''}
        ${u.nunca_entrou ? '<span class="tag" title="Ainda não entrou na Gestão TI. Os créditos ficam esperando o primeiro acesso.">nunca entrou</span>' : ''}
        <span style="flex:1"></span>
        ${u.ilimitado ? '<span class="tag indigo">sem limite</span>' : `<span class="saldo-num ${u.saldo ? '' : 'zero'}">${txtCreditos(u.saldo || 0)}</span>`}</div>
      <div class="meta"><span>${u.email ? esc(u.email) : '<span style="color:var(--ruim)">sem e-mail no AD</span>'}</span>${u.unidade ? `<span>Setor: ${esc(u.unidade)}</span>` : ''}
        <span>${numero(u.disparos)} disparo(s)</span><span>Último disparo: ${u.ultimo_disparo ? dataHora(u.ultimo_disparo) : '—'}</span></div>
      <div class="acoes">${u.ilimitado ? '' : `<button class="btn peq indigo" data-op="dar" data-u="${esc(u.usuario)}">Liberar créditos</button>
        <button class="btn peq contorno-perigo" data-op="tirar" data-u="${esc(u.usuario)}" ${u.saldo ? '' : 'disabled title="Sem créditos para remover"'}>Remover créditos</button>`}
        <button class="btn peq" data-op="extrato" data-u="${esc(u.usuario)}">Extrato</button></div></article>`).join('')
    || '<div class="vazio">Ninguém encontrado.</div>';
  $('#u-paginas').innerHTML = lista.length ? `<span>${numero(ini + 1)}–${numero(ini + pagina.length)} de ${numero(lista.length)}</span>` + botoesPaginas(PAGINA, paginas) : '';
}
$('#usuarios').addEventListener('click', async ev => {
  const b = ev.target.closest('button[data-op]'); if (!b) return;
  const u = USUARIOS.find(x => x.usuario === b.dataset.u); if (!u) return;
  if (b.dataset.op === 'extrato') return extratoDe(u.usuario);
  const dar = b.dataset.op === 'dar';
  const r = await Swal.fire({ title: dar ? 'Liberar créditos' : 'Remover créditos', showCancelButton: true, focusConfirm: false,
    confirmButtonText: dar ? 'Liberar' : 'Remover', cancelButtonText: 'Voltar', customClass: dar ? {} : { confirmButton: 'perigo' },
    html: `<div class="pilha" style="text-align:left">
      <p style="margin:0"><b>${esc(u.nome)}</b> (${esc(u.usuario)}) tem <b>${txtCreditos(u.saldo || 0)}</b>.</p>
      <div class="campo"><label for="c-qtd">${dar ? 'Quantos créditos liberar' : 'Quantos créditos remover'}</label>
        <input class="entrada" id="c-qtd" type="number" min="1" max="${dar ? 1000 : (u.saldo || 0)}" value="${dar ? 5 : 1}"></div>
      <div class="campo"><label for="c-motivo">Motivo (opcional, aparece no extrato da pessoa)</label><input class="entrada" id="c-motivo" maxlength="500"></div></div>`,
    preConfirm: () => {
      const q = Number($('#c-qtd').value);
      if (!q || q < 1) return Swal.showValidationMessage('Informe a quantidade.');
      if (!dar && q > (u.saldo || 0)) return Swal.showValidationMessage(`A pessoa só tem ${txtCreditos(u.saldo || 0)}.`);
      return { usuario: u.usuario, quantidade: dar ? q : -q, motivo: $('#c-motivo').value.trim() };
    } });
  if (!r.isConfirmed) return;
  try {
    const res = await chamar('/api/email/creditos/conceder', { method: 'POST', body: JSON.stringify(r.value) });
    toast(`${u.nome}: saldo agora ${txtCreditos(res.saldo)}.`); carregarUsuarios();
  } catch (e) { erro(e); }
});

// ---------------------------------------------------------------- extrato
let E_PESSOA = '', E_TIPO = '', E_PAGINA = 1, MOVIMENTOS = [];
const E_POR_PAGINA = 15;
$('#e-tipo').addEventListener('click', ev => {
  const b = ev.target.closest('[data-tipo]'); if (!b) return;
  E_TIPO = b.dataset.tipo; E_PAGINA = 1;
  document.querySelectorAll('#e-tipo .chip').forEach(c => c.classList.toggle('ativo', c === b));
  mostrarExtrato();
});
$('#e-busca').addEventListener('input', () => { E_PAGINA = 1; mostrarExtrato(); });
$('#e-pessoa').addEventListener('click', ev => { if (ev.target.closest('[data-limpar]')) { E_PESSOA = ''; E_PAGINA = 1; carregarExtrato(); } });
$('#e-paginas').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-pag]'); if (!b || b.disabled) return;
  E_PAGINA = Number(b.dataset.pag); mostrarExtrato();
  $('#painel-extrato').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
// Abre o extrato de uma pessoa (botao Extrato da aba Usuarios e saldos)
function extratoDe(login) { E_PESSOA = login; E_PAGINA = 1; $('#e-busca').value = ''; trocarAba('extrato'); }
const nomeDe = login => (USUARIOS.find(u => u.usuario === login) || {}).nome;
async function carregarExtrato() {
  try {
    MOVIMENTOS = await chamar('/api/email/creditos/movimentos' + (E_PESSOA ? '?usuario=' + encodeURIComponent(E_PESSOA) : ''));
    const nome = nomeDe(E_PESSOA) || (MOVIMENTOS[0] || {}).nome || E_PESSOA;
    $('#e-pessoa').innerHTML = E_PESSOA ? `<span class="tag indigo" style="font-size:13px;padding:6px 12px">Extrato de ${esc(nome)} (${esc(E_PESSOA)})</span>
      <button class="btn peq" data-limpar>Ver de todas as pessoas</button>` : '';
    $('#e-pessoa').classList.toggle('oculto', !E_PESSOA);
    mostrarExtrato();
  } catch (e) { erro(e); }
}
function mostrarExtrato() {
  const q = $('#e-busca').value.trim().toLowerCase();
  const todos = MOVIMENTOS.filter(m => (!E_TIPO || (E_TIPO === 'entrada' && m.quantidade > 0) || (E_TIPO === 'saida' && m.quantidade < 0) || (E_TIPO === 'consumo' && m.tipo === 'consumo'))
    && (!q || `${m.nome || nomeDe(m.usuario) || ''} ${m.usuario} ${m.por} ${m.motivo || ''} ${m.tipo_nome}`.toLowerCase().includes(q)));
  const paginas = Math.max(1, Math.ceil(todos.length / E_POR_PAGINA));
  E_PAGINA = Math.min(Math.max(1, E_PAGINA), paginas);
  const ini = (E_PAGINA - 1) * E_POR_PAGINA, lista = todos.slice(ini, ini + E_POR_PAGINA);
  $('#extrato').innerHTML = lista.map(m => `<article class="item mov">
      <span class="mov-qtd ${m.quantidade > 0 ? 'mais' : 'menos'}">${m.quantidade > 0 ? '+' : ''}${m.quantidade}</span>
      <div class="mov-corpo">
        <div class="topo-item"><b>${esc(m.tipo_nome)}</b><span>·</span>${(m.nome || nomeDe(m.usuario)) ? `<span>${esc(m.nome || nomeDe(m.usuario))}</span>` : ''}<span class="tag">${esc(m.usuario)}</span>
          <span style="flex:1"></span><span class="mov-saldo">saldo: <b>${txtCreditos(m.saldo_depois)}</b></span></div>
        <div class="meta"><span>${dataHora(m.em)}</span><span>por ${esc(m.por)}</span>${m.disparo_id ? `<span>disparo nº ${m.disparo_id}</span>` : ''}</div>
        ${m.motivo ? `<div class="quebra" style="font-size:14px;color:var(--suave)">${esc(m.motivo)}</div>` : ''}
      </div></article>`).join('')
    || `<div class="vazio">${q || E_TIPO ? 'Nenhum movimento encontrado.' : 'Nenhum movimento ainda.'}</div>`;
  $('#e-paginas').innerHTML = todos.length ? `<span>${numero(ini + 1)}–${numero(ini + lista.length)} de ${numero(todos.length)}</span>` + botoesPaginas(E_PAGINA, paginas) : '';
}

carregarMarca().then(abrir);
</script>
</body>
</html>
